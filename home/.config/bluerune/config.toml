# Started cautiously: change either in Settings when you're ready.

[appearance]
mode = "dark"

[bar]

[bar.tray]
pinned = ["Fcitx", "Steam", "SpiderWeb", "TelegramDesktop", "qBittorrent", "Proton VPN", "Microsoft Teams", "Microsoft Teams (1)", "Microsoft Teams (2)"]

[notifications]
senders = ["notify-send", "omp", "bluerune-settings.desktop", "Screenshots", "org.kde.kded6.desktop", "bluerune.desktop", "org.telegram.desktop", "org.qbittorrent.qBittorrent.desktop", "firefox-developer-edition.desktop", "ps5upload-desktop", "blueman"]
timeout = 7

[display.night_light]
temperature = 5000

[wallpaper]
picture = "/home/joey/Pictures/wallpapers/blue-forest.jpg"

[wallpaper.clock]
enabled = true

[dock]
pinned = ["firefox-developer-edition"]
reveal_at_edge = false

[lock]
idle = "30m"

[power.idle.ac]
dim = "never"
suspend = "45m"

[screenshots]
text_command = "/home/joey/.local/bin/indra-text {file} --cores 4"

[login]
take_over = true

[workspace]
animation_speed = 1.5

[fonts]
clock_weight = 700

[sounds]
theme = "bluerune-retro"
