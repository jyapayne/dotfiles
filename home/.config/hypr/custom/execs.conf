# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# SpiderWeb: Hyprland starts neither graphical-session.target nor XDG autostart
# entries, so start what /etc/xdg/autostart/spiderweb-*.desktop and the
# spiderweb-agent user unit would.
exec-once = sleep 2 && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user start spiderweb-agent.service
exec-once = /usr/bin/spiderweb-desktop mounts session
exec-once = /usr/bin/spiderweb-desktop host --login
exec-once = /usr/bin/spiderweb-desktop integration watch
