# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Suppress Chromium-based browsers sending rogue maximize/unmaximize events
# that cause tiled windows to flicker/resize momentarily
windowrulev2 = suppressevent maximize, class:^(microsoft-edge)$
