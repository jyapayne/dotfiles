# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

##! Scrolling
# Load the ABI-checked wheel dispatcher; reuse its build on configuration reload.
exec = /usr/bin/python3 /home/joey/.local/share/keyboard-scroll/load.py
unbind = Ctrl+Super, j
unbind = Ctrl+Super, k
binde = Ctrl+Super, j, exec, hyprctl dispatch keyboardscroll down # Scroll down one notch (hold to repeat)
binde = Ctrl+Super, k, exec, hyprctl dispatch keyboardscroll up # Scroll up one notch (hold to repeat)

