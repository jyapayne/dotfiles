# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# Persistent monitor rule for external display (fallback when desc: matching fails)
# This prevents 720p fallback during lock/unlock DPMS cycles
monitor=DP-2,2880x1800@120,0x0,1.0,bitdepth,10

input {
  accel_profile = flat
  sensitivity = 0
}

xwayland {
  force_zero_scaling = true
}

