# Generated by BlueRune. Changes made here are lost: use Settings instead.
# To write this file yourself, delete these two lines; BlueRune then leaves it alone.

general {
    lock_cmd = bluerunectl lock || pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Dim the screen, on battery while it isn't low.
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
    condition_cmd = ! systemd-ac-power && ! busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/DisplayDevice org.freedesktop.UPower.Device WarningLevel | grep -qx 'u [345]'
    condition_retry = 30
}

# Dim the screen, once the battery is low.
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
    condition_cmd = ! systemd-ac-power && busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/DisplayDevice org.freedesktop.UPower.Device WarningLevel | grep -qx 'u [345]'
    condition_retry = 30
}

# Lock the screen.
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# Turn the screens off, while plugged in.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    condition_cmd = systemd-ac-power
    condition_retry = 30
}

# Turn the screens off, on battery while it isn't low.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    condition_cmd = ! systemd-ac-power && ! busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/DisplayDevice org.freedesktop.UPower.Device WarningLevel | grep -qx 'u [345]'
    condition_retry = 30
}

# Turn the screens off, once the battery is low.
listener {
    timeout = 120
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    condition_cmd = ! systemd-ac-power && busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/DisplayDevice org.freedesktop.UPower.Device WarningLevel | grep -qx 'u [345]'
    condition_retry = 30
}

# Suspend, while plugged in.
listener {
    timeout = 2700
    on-timeout = systemctl suspend
    condition_cmd = systemd-ac-power
    condition_retry = 30
}

# Suspend, on battery while it isn't low.
listener {
    timeout = 900
    on-timeout = systemctl suspend
    condition_cmd = ! systemd-ac-power && ! busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/DisplayDevice org.freedesktop.UPower.Device WarningLevel | grep -qx 'u [345]'
    condition_retry = 30
}

# Suspend, once the battery is low.
listener {
    timeout = 300
    on-timeout = systemctl suspend
    condition_cmd = ! systemd-ac-power && busctl --system get-property org.freedesktop.UPower /org/freedesktop/UPower/devices/DisplayDevice org.freedesktop.UPower.Device WarningLevel | grep -qx 'u [345]'
    condition_retry = 30
}
