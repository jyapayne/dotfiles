<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Written by BlueRune's Fonts settings, and rewritten whenever they change: put your own
     changes in ../fonts.conf, which is read after this file and wins over it. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
