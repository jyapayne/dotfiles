# Written by BlueRune from the accent color and light or dark, and rewritten whenever they change.
# mpv uses it while mpv.conf includes it, as BlueRune's /etc/mpv/mpv.conf does.
osd-color="#ffeff0f2"
osd-back-color="#e6252629"
osd-outline-color="#e6252629"
osd-selected-color="#ff4392f7"
osd-selected-outline-color="#e6252629"
script-opts-append="osc-background_color=#121314"
script-opts-append="osc-timecode_color=#4392f7"
script-opts-append="osc-title_color=#eff0f2"
script-opts-append="osc-time_pos_color=#eff0f2"
script-opts-append="osc-time_pos_outline_color=#121314"
script-opts-append="osc-buttons_color=#eff0f2"
script-opts-append="osc-top_buttons_color=#eff0f2"
script-opts-append="osc-held_element_color=#a2a5aa"
